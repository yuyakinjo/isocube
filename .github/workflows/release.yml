name: release

# Tags are a result of publishing, not a release trigger.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Validate the version, package, and release notes without publishing
        type: boolean
        default: false

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      # Compute and write once so crossing a minute cannot change the version.
      - name: decide and write the version
        id: version
        run: |
          version="$(bun run --silent version:next --write)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version"
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            echo "Version $version already has a release tag. Retry in the next UTC minute." >&2
            exit 1
          fi

      - run: bun run ci

      - name: inspect the package
        run: npm pack --dry-run

      - name: write the release notes
        run: bun scripts/release-notes.ts > "$RUNNER_TEMP/notes.md"

      - name: preview the release
        if: inputs.dry-run
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Would publish $VERSION"
          cat "$RUNNER_TEMP/notes.md"

      # npm CLI >= 11.5.1 uses OIDC; no NPM_TOKEN or NODE_AUTH_TOKEN required.
      - name: publish
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance --access public

      - name: record the release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release $VERSION"
          git tag "v$VERSION"
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
